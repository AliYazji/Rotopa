name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql-tests:
    name: SQL migrations + test suite
    runs-on: ubuntu-latest
    services:
      # Same image supabase/tests/run.sh uses locally — keeps CI and local
      # runs behaviourally identical (extensions, defaults, everything).
      # Deliberately NOT setting POSTGRES_DB here: this image's own init
      # scripts apply Supabase's restrictive per-database ACLs at boot, and
      # a database created that way via the vanilla postgres entrypoint
      # ends up with "permission denied" for the postgres role itself
      # (verified directly) — a database the postgres role creates itself
      # AFTER boot is owned by it and works fine, exactly what the
      # create-database step below does, mirroring run.sh's own RESET().
      postgres:
        image: public.ecr.aws/supabase/postgres:15.6.1.139
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Create the target database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "create database rotopa;"

      - name: Apply migrations and run the test suite
        env:
          # run.sh already supports pointing at an external Postgres instead
          # of spinning up its own docker container — exactly this case.
          PGURL: postgres://postgres:postgres@localhost:5432/rotopa
        run: bash supabase/tests/run.sh

      - name: Bulk-posting performance smoke check (regression tripwire, not a benchmark)
        run: psql "postgres://postgres:postgres@localhost:5432/rotopa" -v ON_ERROR_STOP=1 < supabase/tests/performance/bulk-posting.sql

  concurrency-test:
    name: Concurrency — stock oversell guard under real parallel access
    runs-on: ubuntu-latest
    services:
      # same image + same POSTGRES_DB rationale as sql-tests above
      postgres:
        image: public.ecr.aws/supabase/postgres:15.6.1.139
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Run two genuinely concurrent sell attempts against limited stock
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/concurrency/run.sh

  web:
    name: Web app — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # runs `tsc --noEmit && vite build` per package.json — same command
      # used everywhere in this project to verify a change before shipping.
      - run: npm run build

  etl:
    name: ETL — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: etl/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
